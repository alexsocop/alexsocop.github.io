title: Alex Socop
description: |
  <p>Myron Alexander Socop Arango（舒冠宇）</p>

  <p>Xelajuj No'j (Quetzaltenango), Guatemala, 1988. Indigenous K’iche’ Maya scholar and writer. His literary work has been published in diverse magazines and collections. The most recent one is <a href="https://puntodepartida.unam.mx/numeros/no-0190/0190-poesia-guatemalteca-actual-alexander-socop-arango/" target="_blank"><em>Punto de partida 190</em></a> (UNAM, 2015). He published <em>Temblores del silencio</em> (Metáfora editores, 2012) and <em>Poemas sueltos</em> (90 plaquettes, 2014). He has participated in poetry festivals in Central America and Mexico, and he was part of the organizing committee for the <a href="https://www.instagram.com/fipq_metafora/" target="_blank">Quetzaltenango International Poetry Festival</a> from 2011 to 2019.</p> 

  <p>In 2021, he received the <a href="https://en.mofa.gov.tw/cp.aspx?n=1325" target="_blank">MOFA scholarship</a> to pursue doctoral studies at <a href="https://en.ntnu.edu.tw/" target="_blank">National Taiwan Normal University (NTNU)</a>. In 2024, he was granted the <a href="https://cognitivesciencesociety.org/broadening-participation-in-cognitive-science-initiative/" target="_blank">Broadening Participation in Cognitive Science Initiative Award</a> for the project: <a href="https://github.com/smy1/cogsci-maya" target="_blank"><em>The Cognitive Science Behind the Adventures of Junajpu and Xbalamke: Spreading Awareness of Cognitive Science Among Educators in Mayan and Mestizo Communities.</em></a></p>

  <p>His academic and professional interests broadly include shared book reading and brain development; EMI, multicultural and global education; and environmental humanities with emphasis on ecocriticism.</p>

  <p>Currently he works as a Project Manager at the <a href="https://rcemi.ntnu.edu.tw/about/team/page/32" target="_blank">Resource Center for EMI (RCEMI)</a>, and is part of the research team at the <a href="https://www.ntnuchildbrain.org/people" target="_blank">Child Brain Development and Learning Lab</a> at NTNU.</p>

